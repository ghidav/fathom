[project]
name = "fathom-rollouts"  # `fathom` on PyPI is another library; the module is still `fathom`
version = "0.1.0"
description = "Analyse agent rollouts: flag their mistakes, and tag, search and cluster their turns, in layers kept beside the ATIF trajectory"
readme = "README.md"
authors = [
    { name = "ghidav", email = "davide.ghilardi0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embed = ["numpy"]  # embedding turns, reading the vectors back, and searching a group's tags
cluster = ["numpy", "scikit-learn>=1.3", "umap-learn>=0.6"]  # clustering a group's turns by their tags
api = ["anthropic>=2.9.0"]  # the reader that asks the Claude API directly, which tags turns

[dependency-groups]
dev = [
    "anthropic>=2.9.0",
    "numpy",
    "pytest",
    "scikit-learn>=1.3",
    "umap-learn>=0.6",
]

[tool.uv.build-backend]
module-name = "fathom"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
